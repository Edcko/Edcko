name: Update top languages card

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: top-langs
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate cards
        env:
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          LANGS_COUNT: "8"
        run: node .github/scripts/top-langs.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- generated; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git commit -m "chore: update top languages card"
          git push
